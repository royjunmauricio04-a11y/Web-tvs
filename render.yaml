services:
  - type: web
    name: web-tvs
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: KEEP_ALIVE
        value: "true"
      # Supabase (accounts storage). Set these two in the Render dashboard (values are secret):
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
